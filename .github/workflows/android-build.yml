name: Android CI - Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /opt/hostedtoolcache/jdk/17*/x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android SDK command-line tools and accept licenses
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          if [ -d "$HOME/android-sdk/cmdline-tools/cmdline-tools" ]; then
            mv $HOME/android-sdk/cmdline-tools/cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest/ || true
          else
            mv $HOME/android-sdk/cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest/ || true
          fi
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          # Accept licenses (ignore broken-pipe non-zero)
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_SDK_ROOT} --licenses || true
          # Install required SDK components (change android-33 if your project needs different)
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "platform-tools" "platforms;android-33" "build-tools;33.0.0" || true
        shell: bash

      - name: Add ANDROID_SDK_ROOT and update PATH
        run: |
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Prepare project folder (unzip if needed)
        run: |
          # If the repository contains a ZIP of the project, extract it
          if [ -f PDFCraftStudio.zip ]; then
            unzip -q PDFCraftStudio.zip -d .
          fi
          # If unzip created a directory named PDFCraftStudio, use it; else use repo root
          if [ -d PDFCraftStudio ]; then
            echo "PROJECT_DIR=PDFCraftStudio" >> $GITHUB_ENV
          else
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          fi
        shell: bash

      - name: Show project files (debug)
        run: |
          echo "Project dir: $PROJECT_DIR"
          ls -la $PROJECT_DIR | sed -n '1,200p'
        shell: bash

      - name: Build debug APK (use wrapper if present, else install gradle)
        run: |
          echo "Building from project dir: $PROJECT_DIR"
          if [ -f $PROJECT_DIR/gradlew ]; then
            chmod +x $PROJECT_DIR/gradlew
            cd $PROJECT_DIR
            ./gradlew :app:assembleDebug --no-daemon
          else
            sudo apt-get update
            sudo apt-get install -y gradle
            # Use -p to run in the project directory if wrapper missing
            gradle :app:assembleDebug -p "$PROJECT_DIR"
          fi
        shell: bash

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
